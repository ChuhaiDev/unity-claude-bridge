# Publishes the package as a Unity scoped registry on GitHub Pages.
# Release = bump "version" in the package's package.json and push to main; the version gets tagged automatically.
name: Publish registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # tag new versions
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: registry
        run: python3 tools/build_registry.py --out _site
      - name: Tag new version
        run: |
          v="v${{ steps.registry.outputs.head_version }}"
          if ! git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            git tag "$v" && git push origin "$v"
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
